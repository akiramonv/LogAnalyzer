  # ------------------------------------------------------------------ #
  # Spring: контекст и конфигурация                                     #
  # ------------------------------------------------------------------ #

  - name: bean-creation-failure
    description: Не удалось создать бин
    priority: 85
    when:
      exceptionType: 'BeanCreationException|BeanInstantiationException|ApplicationContextException'
    annotate:
      - type: CONFIGURATION
        label: Ошибка создания бина
    cause:
      title: Не удалось поднять контекст Spring — ошибка создания бина
      description: >-
        Приложение не стартовало: при создании одного из бинов вылетело исключение, и Spring
        прервал инициализацию контекста. Само сообщение о бине почти никогда не объясняет причину —
        оно лишь называет место. Настоящая ошибка находится в самом глубоком Caused by: это может
        быть недоступная база, отсутствующее свойство конфигурации, конфликт версий библиотек
        или ошибка в самом конструкторе бина.
      category: configuration
      confidence: 0.8
      recommendation: >-
        Читайте цепочку Caused by снизу вверх — последнее звено и есть причина, остальное лишь
        обёртки Spring.
      steps:
        - >-
          Раскройте стек и найдите самый глубокий Caused by — начинайте разбор с него.
        - >-
          Определите, какой бин не создался и что он требует при инициализации: соединение с БД,
          свойство конфигурации, другой бин.
        - >-
          Если это внешний ресурс — проверьте его доступность из этого окружения и корректность
          адреса в конфигурации.
        - >-
          Если это отсутствующее свойство — сверьте профили и переменные окружения того контура,
          где приложение упало.
        - >-
          Проверьте, что нужный профиль Spring действительно активен: часть бинов создаётся
          по условиям @ConditionalOn* и @Profile.

  - name: no-such-bean
    description: Бин не найден
    priority: 85
    when:
      exceptionType: 'NoSuchBeanDefinitionException|UnsatisfiedDependencyException'
    annotate:
