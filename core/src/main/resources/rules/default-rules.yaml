      recommendation: >-
        Проверьте сканирование пакетов, профили Spring и условия @ConditionalOn*
        для отсутствующего компонента.

  - name: placeholder-unresolved
    description: Не разрешено свойство конфигурации
    priority: 85
    when:
      messageRegex: 'Could not resolve placeholder'
    annotate:
      - type: CONFIGURATION
        label: Отсутствует свойство
    cause:
      title: В конфигурации отсутствует обязательное свойство
      description: >-
        Spring не смог подставить значение вместо плейсхолдера ${...}: свойства нет ни в
        application.yml, ни в переменных окружения, ни в конфиг-сервере — во всяком случае,
        для того профиля, с которым запущено приложение. Частая ситуация при выкатке в новый
        контур: локально свойство есть, а в среде развёртывания его забыли добавить в секреты
        или ConfigMap.
      category: configuration
      confidence: 0.9
      recommendation: >-
        Добавьте свойство в конфигурацию того окружения, где приложение упало, и проверьте,
        что активен ожидаемый профиль.
      steps:
        - >-
          Возьмите имя свойства из сообщения — оно указано прямо в тексте ошибки.
        - >-
          Проверьте, какой профиль был активен при запуске (в стартовых строках лога есть
          «The following profiles are active»).
        - >-
          Найдите свойство в конфигурации этого контура: application-<профиль>.yml, переменные
          окружения, ConfigMap или секреты, конфиг-сервер.
        - >-
          Если свойство необязательное, задайте значение по умолчанию прямо в плейсхолдере -
          "${my.prop:значение}".
        - >-
          Для обязательных настроек используйте "@ConfigurationProperties" с валидацией, чтобы
          отсутствие значения обнаруживалось на старте с понятным сообщением.

  - name: port-in-use
    description: Порт занят
    priority: 90
    when:
      anyMessageRegex:
        - 'Port \d+ was already in use'
        - 'Address already in use'
        - 'BindException'
    annotate:
      - type: CONFIGURATION
        label: Порт занят
    cause:
      title: Порт приложения уже занят другим процессом
      description: >-
        Приложение не смогло занять порт: его уже слушает другой процесс. Чаще всего это
        предыдущий экземпляр того же сервиса, который не завершился (запуск из IDE поверх
        работающего, зависший процесс после сбоя) или соседний сервис с тем же портом
        в конфигурации.
      category: infrastructure
      confidence: 0.95
      recommendation: >-
        Найдите и остановите процесс, занявший порт, либо задайте приложению другой порт.
      steps:
        - >-
          Определите занятый порт из сообщения.
        - >-
          Найдите процесс - Windows "netstat -ano | findstr :<порт>" затем "taskkill /PID <pid> /F";
          Linux/macOS - "lsof -i :<порт>" затем "kill <pid>".
        - >-
          Убедитесь, что это не рабочий экземпляр сервиса, прежде чем завершать процесс.
        - >-
          Если порт нужен другому приложению, задайте свой - "server.port" в конфигурации
          или переменной окружения "SERVER_PORT".
        - >-
          Для локальной разработки удобно "server.port=0" — система выдаст свободный порт
          автоматически.

