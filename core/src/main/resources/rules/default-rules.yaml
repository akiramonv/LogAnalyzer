      title: Конфликт версий зависимостей
      description: >-
        Класс в classpath есть, но его сигнатуры не совпадают с теми, под которые компилировался
        вызывающий код: метод исчез, изменил параметры или стал другого типа. Это классический
        признак того, что в сборку попали две разные версии одной библиотеки и победила не та,
        под которую написан код. Часто версия приходит транзитивно — через другую зависимость,
        поэтому в build-файле её не видно.
      category: dependencies
      confidence: 0.9
      recommendation: >-
        Найдите в дереве зависимостей все версии проблемной библиотеки и зафиксируйте одну.
      steps:
        - >-
          Определите по сообщению класс и метод, которых не хватает, и библиотеку, где они живут.
        - >-
          Постройте дерево зависимостей и найдите все версии этой библиотеки -
          "./gradlew dependencies" или "mvn dependency:tree -Dincludes=<группа>".
        - >-
          Определите, кто тянет лишнюю версию транзитивно, и либо исключите её, либо обновите
          зависимость-источник.
        - >-
          Зафиксируйте версию явно (Gradle - "constraints" или "resolutionStrategy.force",
          Maven - "dependencyManagement").
        - >-
          Пересоберите с чистого листа и убедитесь, что в итоговом артефакте осталась одна версия.

  # ------------------------------------------------------------------ #
  # Безопасность и валидация                                            #
  # ------------------------------------------------------------------ #

  - name: authentication-failed
