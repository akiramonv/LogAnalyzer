  - name: socket-timeout
    description: Таймаут чтения ответа
    priority: 85
    when:
      anyMessageRegex:
        - 'SocketTimeoutException'
        - 'Read timed out'
        - 'ReadTimeoutException'
        - 'timeout of \d+ ?ms exceeded'
    annotate:
      - type: TIMEOUT
        label: Таймаут ответа внешней системы
      - type: EXTERNAL_CALL
        label: Внешний вызов
    cause:
      title: Внешняя система не ответила за отведённое время
      description: >-
        Соединение с внешней системой было установлено успешно — значит, сеть и адрес в порядке,
        — но ответ не пришёл до истечения read timeout, и клиент разорвал ожидание. Причина
        находится на стороне вызываемого сервиса или между вами: он деградировал, ушёл в долгие
        запросы к своей базе, упёрся в свой пул потоков, либо трафик режет прокси. Важное следствие:
        запрос мог быть выполнен на той стороне — при повторе операция может продублироваться,
        если она не идемпотентна.
      category: integration
      confidence: 0.85
      recommendation: >-
        Разбирайтесь с вызываемой системой, а не с местом падения: здесь код лишь не дождался ответа.
      steps:
        - >-
          Откройте логи вызываемого сервиса за это же время — по тому же traceId, если сквозная
          трассировка настроена, иначе по времени и параметрам запроса.
        - >-
          Посмотрите, сколько именно ждали (длительность есть в событии) и сравните с настроенным
          read timeout — так станет ясно, сработал таймаут или ответа не было вовсе.
        - >-
          Проверьте, идемпотентна ли операция. Если нет — повтор после таймаута может создать
          дубликат; используйте ключ идемпотентности.
        - >-
          Сверьте таймауты по цепочке: клиентский должен быть заметно меньше, чем время ожидания
          вышестоящего вызова, иначе ошибка расползается на весь путь запроса.
        - >-
          Если такие таймауты повторяются, добавьте circuit breaker, чтобы не держать потоки
          в ожидании заведомо неработающей системы.

  - name: connect-timeout
    description: Таймаут установки соединения
    priority: 85
    when:
      anyMessageRegex:
        - 'ConnectTimeoutException'
        - 'connect timed out'
        - 'Connection timed out'
    annotate:
      - type: TIMEOUT
        label: Таймаут подключения
      - type: EXTERNAL_CALL
        label: Внешний вызов
    cause:
      title: Не удалось установить соединение с внешней системой
      category: integration
      confidence: 0.85
      recommendation: Проверьте доступность хоста и порта, сетевые политики и DNS.

  - name: connection-refused
    description: Соединение отклонено
    priority: 85
    when:
      anyMessageRegex:
        - 'Connection refused'
        - 'ConnectException'
    annotate:
      - type: EXTERNAL_CALL
        label: Соединение отклонено
    cause:
      title: Целевой сервис недоступен (connection refused)
      description: >-
        Хост ответил явным отказом на попытку подключения: на этом порту никто не слушает.
        Это отличается от таймаута — там пакеты уходили «в никуда», здесь ответ пришёл сразу.
        Типичные ситуации: сервис упал или ещё не поднялся, перезапускается при деплое,
        слушает другой порт или только localhost внутри контейнера, либо в конфигурации указан
        не тот адрес.
      category: integration
      confidence: 0.9
      recommendation: >-
        Проверьте, что процесс на той стороне жив и слушает именно тот адрес и порт,
        которые указаны в конфигурации.
      steps:
        - >-
          Возьмите из сообщения адрес и порт и сверьте их с конфигурацией — часто расходятся
          именно они (staging вместо prod, внутренний адрес вместо внешнего).
        - >-
          Проверьте состояние вызываемого сервиса за это время: не было ли перезапуска, деплоя
          или падения контейнера.
        - >-
          Убедитесь, что сервис слушает не только 127.0.0.1: внутри контейнера такой адрес
          недоступен снаружи.
        - >-
          Проверьте доступность вручную с той же машины (telnet, curl, nc) — так сразу видно,
          сетевая это проблема или адрес неверный.
        - >-
          Если отказ приходит во время деплоя, добавьте повтор с задержкой и проверку готовности
          (readiness probe), чтобы трафик не шёл на неподнявшийся экземпляр.

