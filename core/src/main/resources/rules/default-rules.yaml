  - name: circuit-breaker-open
    description: Circuit breaker разомкнут
    priority: 80
    when:
      anyMessageRegex:
        - 'CircuitBreaker ''[^'']+'' is OPEN'
        - 'CallNotPermittedException'
        - 'circuit breaker is open'
    annotate:
      - type: RESILIENCE
        label: Circuit breaker OPEN
    cause:
      title: Вызовы блокируются разомкнутым circuit breaker
      description: >-
        Предохранитель разомкнут и отклоняет вызовы, не выполняя их: доля неуспешных обращений
        к внешней системе превысила порог. Само это сообщение — не первопричина, а защита,
        которая уже сработала: настоящие ошибки произошли раньше, до размыкания. Пока
        предохранитель открыт, все вызовы будут отклоняться мгновенно, даже если система
        уже восстановилась — до истечения времени ожидания и пробного полуоткрытого состояния.
      category: integration
      confidence: 0.75
      recommendation: >-
        Ищите ошибки, которые привели к размыканию, — они в логах до этого момента; здесь виден
        лишь результат.
      steps:
        - >-
          Найдите в логах события за несколько минут до размыкания — там будут исходные ошибки
          (таймауты, 5xx, отказы соединения).
        - >-
          Определите по ним, что случилось с вызываемой системой, и проверьте её текущее состояние.
        - >-
          Сверьте настройки предохранителя с реальностью: порог ошибок, размер окна и время
          до полуоткрытого состояния.
        - >-
          Проверьте, есть ли запасной путь на случай открытого предохранителя (кэш, значение
          по умолчанию, отложенная обработка) — иначе отказ виден пользователю.
        - >-
          Убедитесь, что после восстановления системы предохранитель закрывается: в логах должны
          появиться успешные пробные вызовы.

