name: default
description: >-
  Встроенные правила анализа логов Java/Spring-приложений.
  Каждое правило помечает событие (annotate) и/или выдвигает гипотезу о причине сбоя (cause).
  Файл можно скопировать, отредактировать и подключить ключом --rules.

rules:

  # ------------------------------------------------------------------ #
  # Ошибки прикладного кода                                            #
  # ------------------------------------------------------------------ #

  - name: null-pointer
    description: Обращение к null-ссылке
    priority: 50
    when:
      exceptionType: '(^|\.)NullPointerException$'
    annotate:
      - type: EXCEPTION
        label: NullPointerException
    cause:
      title: Обращение к null-ссылке (NullPointerException)
      description: >-
        Код вызвал метод или обратился к полю объекта, которого нет — переменная содержала null.
        В сообщении современных JVM прямо указано, что именно оказалось null («because ... is null»),
        а верхний кадр стека показывает строку, где это произошло. Само по себе исключение —
        не причина, а следствие: где-то выше по потоку значение не было получено или не было
        проверено. Чаще всего источников три: во внешнем ответе или входном DTO поле отсутствует,
        запрос в базу вернул пусто, либо зависимость не была внедрена в этом сценарии.
      category: code
      confidence: 0.85
      recommendation: >-
        Найдите место, где значение должно было появиться, и решите, что делать с его отсутствием:
        подставить значение по умолчанию, вернуть понятную ошибку или запретить такой вызов.
      steps:
        - >-
          Откройте строку из верхнего кадра стека и определите, какая именно переменная равна null.
        - >-
          Проследите её происхождение вверх по коду: параметр запроса, ответ БД, ответ внешнего
          сервиса, значение из кэша или конфигурации.
        - >-
          Посмотрите события выше по таймлайну: там обычно видно, какие данные пришли в этот запрос
          и не было ли перед этим предупреждения вида «не найдено», «пусто», «профиль отсутствует».
        - >-
          Решите, допустимо ли отсутствие значения. Если да — обработайте явно (Optional, значение
          по умолчанию); если нет — проверяйте на границе приложения и возвращайте 400 с пояснением.
        - >-
          Добавьте регрессионный тест на сценарий с отсутствующим значением — именно он обычно
          не покрыт тестами.

  - name: class-cast
    description: Некорректное приведение типа
    priority: 40
    when:
      exceptionType: '(^|\.)ClassCastException$'
    annotate:
      - type: EXCEPTION
        label: ClassCastException
    cause:
      title: Некорректное приведение типа (ClassCastException)
      category: code
      confidence: 0.8
      recommendation: Проверьте фактический тип объекта и generics в месте приведения.

  - name: index-out-of-bounds
    description: Выход за границы массива или коллекции
    priority: 40
    when:
      exceptionType: 'IndexOutOfBoundsException'
    annotate:
      - type: EXCEPTION
        label: IndexOutOfBoundsException
    cause:
      title: Выход за границы коллекции/массива
      category: code
      confidence: 0.8
      recommendation: Проверьте расчёт индексов и предположения о размере входных данных.

  - name: number-format
    description: Ошибка разбора числа
    priority: 45
    when:
      exceptionType: '(^|\.)NumberFormatException$'
    annotate:
      - type: VALIDATION
        label: NumberFormatException
    cause:
      title: Нечисловое значение там, где ожидалось число
      description: >-
        Код попытался превратить строку в число, а она числом не является — в сообщении видно
        конкретное значение. Практически всегда это данные извне: параметр запроса, поле JSON,
        значение из конфигурации или колонка CSV. Ошибка означает, что данные дошли до бизнес-логики
        без проверки: валидация либо отсутствует, либо выполняется позже разбора.
      category: validation
      confidence: 0.85
      recommendation: >-
        Проверяйте формат на границе приложения и отвечайте понятной ошибкой 400 вместо 500.
      steps:
        - >-
          Посмотрите в сообщении само значение — обычно сразу видно, откуда оно взялось
          (идентификатор с буквами, пустая строка, локализованное число с запятой).
        - >-
          Найдите место разбора по стеку и определите источник значения.
        - >-
          Перенесите проверку на границу: типизированный параметр контроллера, "@Validated"
          с ограничениями, схема для тела запроса.
        - >-
          Верните клиенту 400 с указанием поля и ожидаемого формата — сейчас он получает 500.
        - >-
          Проверьте разделители и локаль, если значение приходит из другого региона
          ("1,5" против "1.5").

  - name: illegal-argument
    description: Некорректный аргумент
    priority: 30
    when:
      exceptionType: '(^|\.)IllegalArgumentException$'
    annotate:
      - type: VALIDATION
        label: IllegalArgumentException
    cause:
      title: Метод получил недопустимый аргумент (IllegalArgumentException)
      category: validation
      confidence: 0.75
      recommendation: Проверьте контракт метода и валидацию данных на границе приложения.

  - name: illegal-state
    description: Недопустимое состояние объекта
    priority: 30
    when:
      exceptionType: '(^|\.)IllegalStateException$'
    annotate:
      - type: EXCEPTION
        label: IllegalStateException
    cause:
      title: Объект оказался в недопустимом состоянии (IllegalStateException)
      category: code
      confidence: 0.7
      recommendation: Проверьте порядок вызовов и жизненный цикл компонента.

  - name: concurrent-modification
    description: Одновременное изменение коллекции
    priority: 45
    when:
      exceptionType: 'ConcurrentModificationException'
    annotate:
      - type: EXCEPTION
        label: ConcurrentModificationException
    cause:
      title: Коллекция изменена во время обхода
      category: concurrency
      confidence: 0.85
      recommendation: Используйте итератор с remove(), copy-on-write коллекции или синхронизацию.

  - name: stack-overflow
    description: Переполнение стека
    priority: 60
    when:
      exceptionType: 'StackOverflowError'
    annotate:
      - type: RESOURCE
        label: StackOverflowError
    cause:
      title: Бесконечная рекурсия (StackOverflowError)
      category: code
      confidence: 0.9
      recommendation: Найдите повторяющийся фрагмент в стеке — он показывает рекурсивный цикл.

  # ------------------------------------------------------------------ #
  # Ресурсы JVM                                                        #
  # ------------------------------------------------------------------ #

  - name: out-of-memory-heap
    description: Нехватка heap-памяти
    priority: 90
    when:
      anyMessageRegex:
        - 'OutOfMemoryError: Java heap space'
        - 'GC overhead limit exceeded'
    annotate:
      - type: RESOURCE
        label: Нехватка heap-памяти
    cause:
      title: Исчерпана heap-память JVM (OutOfMemoryError)
      description: >-
        JVM не смогла выделить память в куче: сборщик мусора не нашёл, что освободить.
        После такой ошибки состояние приложения ненадёжно — часть операций могла оборваться
        в середине, поэтому обычно требуется перезапуск. Причины делятся на три группы:
        единовременная загрузка слишком большого объёма (выборка без пагинации, чтение файла
        целиком, огромный ответ внешнего сервиса), неограниченный рост структур в памяти
        (кэш без лимита, коллекция, в которую только добавляют) и настоящая утечка, когда
        ссылки удерживаются дольше, чем нужно.
      category: resource
      confidence: 0.95
      recommendation: >-
        Определите, что именно заняло память, по heap dump — увеличение -Xmx без этого лишь
        отодвигает повторение проблемы.
      steps:
        - >-
          Включите снятие дампа при сбое, если он ещё не настроен -
          "-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/app".
        - >-
          Откройте дамп в Eclipse MAT или VisualVM и посмотрите отчёт по доминаторам: он покажет,
          какие объекты удерживают основную часть памяти.
        - >-
          Сопоставьте находку с событиями до сбоя в таймлайне: какой запрос или задача выполнялись
          в этот момент и какой объём данных обрабатывали.
        - >-
          Проверьте выборки из БД и вызовы внешних систем на этом пути: есть ли пагинация,
          ограничение размера ответа, потоковая обработка вместо загрузки целиком.
        - >-
          Проверьте кэши: задан ли максимальный размер и время жизни записей.
        - >-
          Увеличивайте -Xmx только после того, как убедились, что рост памяти оправдан нагрузкой,
          а не удержанием лишнего.

  - name: out-of-memory-other
    description: Прочие виды OutOfMemoryError
    priority: 88
    when:
      anyMessageRegex:
        - 'OutOfMemoryError: Metaspace'
        - 'OutOfMemoryError: unable to create( new)? native thread'
        - 'OutOfMemoryError: Direct buffer memory'
    annotate:
      - type: RESOURCE
        label: OutOfMemoryError
    cause:
      title: Исчерпан ресурс JVM (Metaspace/потоки/direct memory)
      category: resource
      confidence: 0.9
      recommendation: >-
        Для Metaspace — проверьте динамическую генерацию классов; для потоков — размер пулов;
        для direct memory — настройки Netty/NIO и -XX:MaxDirectMemorySize.

  - name: thread-pool-rejected
    description: Пул потоков отверг задачу
    priority: 70
    when:
      exceptionType: 'RejectedExecutionException'
    annotate:
      - type: RESOURCE
        label: Пул потоков переполнен
    cause:
      title: Пул потоков не принимает новые задачи
      category: resource
      confidence: 0.85
      recommendation: Проверьте размер пула и очереди, а также длительность выполняемых задач.

  - name: too-many-open-files
    description: Исчерпан лимит файловых дескрипторов
    priority: 80
    when:
      messageRegex: 'Too many open files'
    annotate:
      - type: RESOURCE
        label: Лимит файловых дескрипторов
    cause:
      title: Исчерпан лимит открытых файлов/сокетов
      category: resource
      confidence: 0.9
      recommendation: Проверьте закрытие ресурсов (try-with-resources) и лимит ulimit -n.

  - name: no-disk-space
    description: Закончилось место на диске
    priority: 85
    when:
      messageRegex: 'No space left on device'
    annotate:
      - type: RESOURCE
        label: Нет места на диске
    cause:
      title: Закончилось свободное место на диске
      category: infrastructure
      confidence: 0.95
      recommendation: Освободите место, проверьте ротацию логов и временные файлы.

  # ------------------------------------------------------------------ #
  # База данных                                                         #
  # ------------------------------------------------------------------ #

  - name: hikari-pool-timeout
    description: Исчерпан пул соединений HikariCP
    priority: 85
    when:
      messageRegex: 'Connection is not available, request timed out after'
    annotate:
      - type: DATABASE
        label: Пул соединений исчерпан
      - type: TIMEOUT
        label: Ожидание соединения к БД
    cause:
      title: Исчерпан пул соединений к базе данных
      description: >-
        Поток запросил соединение с БД, все соединения пула были заняты, и он прождал дольше
        connectionTimeout (в сообщении указано, сколько именно и сколько соединений было активно).
        Важно: почти всегда это следствие, а не причина. Пул исчерпывается, когда соединения
        удерживаются слишком долго — из-за медленных запросов без индексов, длинных транзакций,
        блокировок на строках или внешнего HTTP-вызова внутри открытой транзакции. Увеличение
        размера пула обычно лишь отодвигает проблему и добавляет нагрузку на саму базу.
      category: database
      confidence: 0.9
      recommendation: >-
        Ищите не нехватку соединений, а того, кто их держит: долгие запросы, длинные транзакции
        и сетевые вызовы внутри транзакции.
      steps:
        - >-
          Посмотрите в сообщении числа active/idle/waiting — они показывают, что все соединения
          были заняты, а очередь ожидающих росла.
        - >-
          Найдите на стороне БД самые долгие запросы за это время (в PostgreSQL — pg_stat_activity
          и pg_stat_statements, в MySQL — SHOW FULL PROCESSLIST и slow query log).
        - >-
          Проверьте методы с @Transactional: не выполняется ли внутри транзакции обращение
          к внешнему сервису, файлу или очереди — на время такого вызова соединение занято.
        - >-
          Убедитесь, что у запросов, попавших в топ по времени, есть подходящие индексы,
          и что выборки ограничены по объёму (пагинация вместо «выбрать всё»).
        - >-
          Проверьте, что connectionTimeout меньше таймаута HTTP-запроса — иначе поток ждёт
          соединение дольше, чем клиент ждёт ответ.
        - >-
          Размер пула (maximumPoolSize) увеличивайте в последнюю очередь и только убедившись,
          что база выдержит дополнительные параллельные соединения.

  - name: db-deadlock
    description: Взаимная блокировка в БД
    priority: 85
    when:
      anyMessageRegex:
        - 'deadlock detected'
        - 'Deadlock found when trying to get lock'
        - 'DeadlockLoserDataAccessException'
    annotate:
      - type: DATABASE
        label: Deadlock
      - type: TRANSACTION
        label: Взаимная блокировка
    cause:
      title: Взаимная блокировка транзакций (deadlock)
      description: >-
        Две транзакции захватили блокировки в разном порядке и стали ждать друг друга, поэтому
        база принудительно откатила одну из них. Это не поломка данных и не баг СУБД: так она
        разрывает круговое ожидание. Практически всегда причина в том, что разные участки кода
        обновляют одни и те же строки или таблицы в неодинаковой последовательности, либо
        транзакции держатся дольше необходимого и перекрываются по времени.
      category: database
      confidence: 0.9
      recommendation: >-
        Приведите порядок обновления таблиц и строк к единому во всех транзакциях и сократите
        время их жизни; откат одной из транзакций должен обрабатываться повтором.
      steps:
        - >-
          Найдите в логе базы обе участвовавшие транзакции и их запросы (PostgreSQL пишет обе
          стороны в детали ошибки, MySQL — SHOW ENGINE INNODB STATUS).
        - >-
          Определите общий набор строк или таблиц и сравните порядок обращения к ним в обоих
          сценариях — он должен совпадать.
        - >-
          Сократите транзакцию: выносите за её пределы чтение справочников, вызовы внешних систем
          и любую работу, не требующую блокировок.
        - >-
          Добавьте повтор операции при deadlock — это штатная ситуация, транзакцию достаточно
          выполнить заново.
        - >-
          Если конкурируют массовые обновления, обрабатывайте записи батчами в предсказуемом
          порядке (например, по возрастанию идентификатора).

  - name: db-lock-timeout
    description: Таймаут ожидания блокировки
    priority: 80
    when:
      anyMessageRegex:
        - 'Lock wait timeout exceeded'
        - 'could not obtain lock'
        - 'CannotAcquireLockException'
    annotate:
      - type: DATABASE
        label: Таймаут блокировки
      - type: TIMEOUT
        label: Ожидание блокировки строки
    cause:
      title: Транзакция не дождалась освобождения блокировки
      category: database
      confidence: 0.85
      recommendation: Сократите длительность транзакций и проверьте конкурирующие обновления тех же строк.

  - name: db-duplicate-key
    description: Нарушение уникальности
    priority: 80
    when:
      anyMessageRegex:
        - 'duplicate key value violates unique constraint'
        - 'DuplicateKeyException'
        - 'Duplicate entry .* for key'
    annotate:
      - type: DATABASE
        label: Нарушение уникальности
    cause:
      title: Попытка вставить дубликат по уникальному ключу
      description: >-
        База отклонила вставку или обновление: запись с такими значениями уникального индекса
        уже есть. Обычно это признак того, что операция выполняется второй раз — повторная
        доставка сообщения из очереди, ретрай HTTP-запроса после таймаута, двойной клик
        пользователя — либо два параллельных потока одновременно проверили «нет такой записи»
        и оба пошли вставлять. То есть чаще всего проблема не в уникальном индексе, а в отсутствии
        защиты от повторов.
      category: database
      confidence: 0.9
      recommendation: >-
        Сделайте операцию идемпотентной, чтобы повтор не приводил к ошибке: он должен завершаться
        тем же результатом, что и первое выполнение.
      steps:
        - >-
          Определите по сообщению, какой именно индекс нарушен, и какие поля в него входят.
        - >-
          Проверьте, не был ли этот запрос или сообщение обработан ранее — посмотрите события выше
          по таймлайну на предмет ретраев и таймаутов.
        - >-
          Для операций, вызываемых повторно, добавьте ключ идемпотентности и проверку по нему
          либо используйте вставку с игнорированием конфликта (ON CONFLICT DO NOTHING / UPSERT).
        - >-
          Для гонки параллельных вставок опирайтесь на сам уникальный индекс: перехватывайте
          нарушение и трактуйте его как «уже создано», а не как ошибку.
        - >-
          Убедитесь, что клиент получает осмысленный ответ (например, 409 или успех
          с существующей записью), а не 500.

  - name: db-integrity-violation
    description: Нарушение целостности данных
    priority: 70
    when:
      exceptionType: 'DataIntegrityViolationException|ConstraintViolationException'
    annotate:
      - type: DATABASE
        label: Нарушение ограничения БД
    cause:
      title: Нарушено ограничение целостности БД
      category: database
      confidence: 0.8
      recommendation: Проверьте внешние ключи, NOT NULL и уникальные индексы для сохраняемой сущности.

  - name: jpa-lazy-init
    description: Обращение к ленивой коллекции вне сессии
    priority: 75
    when:
      exceptionType: 'LazyInitializationException'
    annotate:
      - type: DATABASE
        label: LazyInitializationException
    cause:
      title: Обращение к ленивому полю вне открытой сессии Hibernate
      description: >-
        Код обратился к связи, помеченной как LAZY, когда транзакция уже закрыта: Hibernate
        не может дозагрузить данные, потому что сессии больше нет. Обычно это происходит,
        когда сущность возвращают из сервисного слоя наружу — в контроллер или сериализатор —
        и уже там читают вложенную коллекцию. Отключать ленивую загрузку не нужно: EAGER
        решает симптом, но тянет лишние данные в каждом запросе и порождает проблему N+1.
      category: database
      confidence: 0.9
      recommendation: >-
        Загружайте нужные связи сразу в запросе, а наружу отдавайте DTO, а не сущность.
      steps:
        - >-
          Найдите по стеку поле, к которому обратились, и место обращения.
        - >-
          Убедитесь, что обращение происходит вне транзакции — как правило, в контроллере
          или при сериализации ответа.
        - >-
          Загрузите связь явно в запросе - "JOIN FETCH" или "@EntityGraph" на методе репозитория.
        - >-
          Возвращайте из сервиса DTO-проекцию с нужными полями вместо самой сущности —
          так лениво загружаемые связи не попадают в слой представления.
        - >-
          Не переводите связь в EAGER «чтобы работало»: это ухудшит все остальные запросы.

