      category: security
      confidence: 0.85
      recommendation: Обновите токен (refresh) и проверьте рассинхронизацию часов между сервисами.

  - name: validation-failed
    description: Ошибка валидации запроса
    priority: 65
    when:
      exceptionType: 'MethodArgumentNotValidException|BindException|ValidationException'
    annotate:
      - type: VALIDATION
        label: Ошибка валидации
    cause:
      title: Входные данные не прошли валидацию
      category: validation
      confidence: 0.8
      recommendation: Сверьте контракт API с фактически присланным телом запроса.

  - name: json-parse-error
    description: Ошибка разбора JSON
    priority: 70
    when:
      exceptionType: 'JsonParseException|JsonMappingException|HttpMessageNotReadableException|MismatchedInputException'
    annotate:
      - type: VALIDATION
        label: Ошибка разбора JSON
    cause:
      title: Некорректный или несовместимый JSON
      description: >-
        Разбор JSON не удался: тело либо синтаксически некорректно, либо не соответствует
        ожидаемой структуре — поле другого типа, отсутствует обязательное свойство, пришёл
        объект вместо массива. Самая частая причина в микросервисах — изменение контракта
        смежным сервисом после его релиза. Второй вариант: вместо JSON пришёл HTML или
        текст ошибки от прокси, а код всё равно попытался его разобрать.
      category: integration
      confidence: 0.85
      recommendation: >-
        Сравните фактически полученное тело с ожидаемой моделью и договоритесь о контракте
        со смежной командой.
      steps:
        - >-
          Посмотрите в сообщении, на каком поле и на какой позиции сломался разбор.
        - >-
          Найдите фактическое тело ответа или запроса — в событиях таймлайна рядом обычно есть
          HTTP-обмен с телом.
        - >-
          Убедитесь, что это вообще JSON: страница ошибки от прокси или балансировщика выглядит
          как HTML и валится на первом же символе.
        - >-
          Сверьте модель с контрактом смежного сервиса: тип поля, обязательность, вложенность.
        - >-
          Сделайте разбор устойчивым к добавлению полей (игнорировать неизвестные), но строгим
          к обязательным — так релиз соседа не будет ронять ваш сервис.

  # ------------------------------------------------------------------ #
  # Очереди и кэш                                                       #
  # ------------------------------------------------------------------ #

  - name: kafka-timeout
    description: Таймаут отправки в Kafka
    priority: 75
    when:
      anyMessageRegex:
        - 'Expiring \d+ record\(s\)'
        - 'TimeoutException: Topic .* not present in metadata'
        - 'Failed to send message to topic'
    annotate:
      - type: MESSAGING
        label: Проблема с Kafka
      - type: TIMEOUT
        label: Таймаут брокера
    cause:
      title: Сообщение не доставлено в Kafka
      description: >-
        Продюсер не смог отправить записи за отведённое время и отбросил их из буфера
        («Expiring N record(s)») либо не получил метаданные топика. Причины: брокеры недоступны
        или перегружены, топик не существует в этом кластере, недостаточно живых реплик для
        подтверждения при acks=all, либо продюсер пишет быстрее, чем успевает отправлять,
        и буфер переполняется.
      category: messaging
      confidence: 0.85
      recommendation: >-
        Проверьте доступность брокеров и существование топика, затем — настройки подтверждения
        и таймаутов продюсера.
      steps:
        - >-
          Проверьте связность с брокерами из этого окружения (адреса из bootstrap.servers)
          и их состояние.
        - >-
          Убедитесь, что топик существует в нужном кластере и имя совпадает — при автосоздании
          топиков ошибка часто в опечатке.
        - >-
          Посмотрите число живых реплик: при "acks=all" отправка не подтвердится, если реплик
          меньше "min.insync.replicas".
        - >-
          Сверьте "delivery.timeout.ms", "request.timeout.ms" и "linger.ms" с реальной скоростью
          отправки; при всплесках нагрузки таймаут может быть слишком мал.
        - >-
          Решите, что делать с недоставленными сообщениями: складывать их в базу как исходящие
          события (шаблон outbox) и повторять отправку, а не терять при сбое.

  - name: kafka-rebalance
    description: Ребалансировка консьюмер-группы
    priority: 55
    when:
      anyMessageRegex:
        - 'group is rebalancing'
        - 'Attempt to heartbeat failed'
        - 'Revoke previously assigned partitions'
    annotate:
      - type: MESSAGING
        label: Ребалансировка Kafka
    cause:
      title: Консьюмер выпал из группы (ребалансировка)
      description: >-
        Между вызовами poll() прошло больше max.poll.interval.ms, брокер счёл консьюмера
        зависшим и передал его партиции другим участникам группы. На практике это значит,
        что обработка одного батча длится слишком долго — обычно из-за медленных запросов
        к БД или синхронных вызовов внешних сервисов внутри цикла обработки. Побочный эффект:
        смещения последнего батча могли не закоммититься, поэтому сообщения будут обработаны
        повторно.
      category: messaging
      confidence: 0.75
      recommendation: >-
        Сократите время обработки одного батча — это надёжнее, чем увеличивать таймаут,
        — и убедитесь, что обработчик выдерживает повторную доставку.
      steps:
        - >-
          Оцените, сколько занимает обработка одного батча, и сравните с "max.poll.interval.ms".
        - >-
          Уменьшите "max.poll.records", чтобы за один цикл обрабатывалось меньше сообщений.
        - >-
          Вынесите долгие операции (внешние вызовы, тяжёлые запросы) из цикла обработки
          в отдельный пул или сделайте их асинхронными.
        - >-
          Убедитесь, что обработчик идемпотентен: после ребалансировки часть сообщений придёт
          повторно.
        - >-
          "max.poll.interval.ms" увеличивайте в последнюю очередь — это лишь отодвигает предел.

  - name: amqp-error
    description: Ошибка RabbitMQ/JMS
    priority: 70
    when:
      exceptionType: 'AmqpException|ListenerExecutionFailedException|JMSException'
    annotate:
      - type: MESSAGING
        label: Ошибка брокера сообщений
    cause:
      title: Сбой при работе с брокером сообщений
      category: messaging
      confidence: 0.7
      recommendation: Проверьте доступность брокера, существование очереди и обработчик сообщения.

  - name: redis-connection
    description: Недоступен Redis
    priority: 75
    when:
      exceptionType: 'RedisConnectionFailureException|JedisConnectionException|RedisCommandTimeoutException'
    annotate:
      - type: CACHE
        label: Ошибка Redis
    cause:
      title: Кэш Redis недоступен
      description: >-
        Приложение не смогло обратиться к Redis: соединение не установилось, оборвалось или
        команда не уложилась в таймаут. Отдельная опасность в том, что кэш обычно находится
        на горячем пути запросов: когда он недоступен, нагрузка целиком уходит в базу, и вслед
        за кэшем начинает деградировать она. Поэтому важно не только поднять Redis, но и решить,
        как сервис ведёт себя без него.
      category: infrastructure
      confidence: 0.85
      recommendation: >-
        Проверьте доступность Redis и убедитесь, что приложение переживает его отсутствие
        без отказа клиентам.
      steps:
        - >-
          Проверьте состояние Redis и связность с ним из этого окружения (адрес, порт, пароль,
          TLS).
        - >-
          Посмотрите, не был ли это кратковременный сбой при отработке отказа (failover)
          в кластере или Sentinel.
        - >-
          Убедитесь, что при недоступном кэше запросы идут в базу, а не падают: обработка
          исключений вокруг обращений к кэшу.
        - >-
          Проверьте таймауты клиента: слишком большие превращают недоступный кэш в зависание
          всех запросов.
        - >-
          Оцените нагрузку на базу за это время — всплеск может объяснить последующие ошибки
          в цепочке.

