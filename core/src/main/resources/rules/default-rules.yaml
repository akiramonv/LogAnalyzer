  # ------------------------------------------------------------------ #
  # Составные сценарии (условие «было раньше в этом же таймлайне»)       #
  # ------------------------------------------------------------------ #

  - name: error-after-retries
    description: Ошибка после серии повторов
    priority: 95
    when:
      levelAtLeast: ERROR
    precededBy:
      withinSeconds: 120
      when:
        anyMessageRegex:
          - 'Retr(y|ying|ied) attempt'
          - 'attempt \d+ of \d+'
    annotate:
      - type: RETRY
        label: Ошибка после исчерпания повторов
    cause:
      title: Операция окончательно провалилась после серии повторов
      description: >-
        Перед ошибкой были повторные попытки, и ни одна не удалась. Это важный признак:
        проблема устойчивая, а не разовый сетевой сбой — иначе повтор бы помог. Значит,
        вызываемая система недоступна или стабильно отвечает ошибкой всё это время.
        Дополнительный риск: если операция не идемпотентна, часть попыток могла всё же
        выполниться на той стороне, создав дубликаты.
      category: integration
      confidence: 0.7
      recommendation: >-
        Разбирайте первую неудачную попытку серии — она показывает исходную неисправность,
        последующие лишь повторяют её.
      steps:
        - >-
          Найдите в таймлайне первую ошибку серии (события с пометкой RETRY идут перед ней)
          и определите её характер: таймаут, отказ соединения, ответ 5xx.
        - >-
          Оцените, сколько всего времени заняли повторы: пока они шли, поток и соединение были
          заняты — это влияет на пропускную способность.
        - >-
          Проверьте, идемпотентна ли операция; если нет — убедитесь, что дубликаты не создались.
        - >-
          Настройте разумную стратегию: ограниченное число попыток, экспоненциальная задержка,
          отказ от повторов для ошибок, которые повтор заведомо не исправит (4xx, валидация).
        - >-
          Если повторы к этой системе случаются часто, добавьте circuit breaker, чтобы не тратить
          на неё потоки.

  - name: error-after-timeout
    description: Ошибка после таймаута внешнего вызова
    priority: 95
    when:
      levelAtLeast: ERROR
    precededBy:
      withinSeconds: 120
      when:
        anyMessageRegex:
          - 'SocketTimeoutException'
          - 'Read timed out'
          - 'timed out after'
          - 'ConnectTimeoutException'
    annotate:
      - type: TIMEOUT
        label: Ошибка вызвана предшествующим таймаутом
    cause:
      title: Сбой стал следствием таймаута внешнего вызова
      category: integration
      confidence: 0.8
      recommendation: >-
        Разбирайтесь с внешней системой, а не с местом падения: приложение упало,
        не дождавшись ответа.
