  - name: http-server-error
    description: Внешний сервис вернул 5xx
    priority: 65
    when:
      httpStatusClass: 5xx
    annotate:
      - type: HTTP_SERVER_ERROR
        label: Ответ 5xx
    cause:
      title: Внешний сервис вернул ошибку 5xx
      description: >-
        Вызов дошёл до внешней системы, и она ответила ошибкой на своей стороне. Это не проблема
        вашего запроса (иначе был бы 4xx) — значит, разбираться нужно в логах вызываемого сервиса.
        Ваш код здесь может лишь корректно пережить отказ: вернуть понятную ошибку, повторить
        попытку, если операция идемпотентна, или использовать запасной путь.
      category: integration
      confidence: 0.7
      recommendation: >-
        Ищите причину в логах вызываемого сервиса по тому же traceId; на своей стороне обеспечьте
        корректную обработку отказа.
      steps:
        - >-
          Возьмите traceId инцидента и найдите по нему запрос в логах смежного сервиса.
        - >-
          Посмотрите тело ответа: часто в нём есть идентификатор ошибки или пояснение.
        - >-
          Уточните у владельцев сервиса, не было ли в это время инцидента или релиза.
        - >-
          Проверьте на своей стороне: не отдаёте ли вы клиенту 500 там, где уместнее 502/503
          с пояснением, что виновата внешняя система.
        - >-
          Оцените необходимость повтора и предохранителя, если такие ответы повторяются.

